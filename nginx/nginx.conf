worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Logging ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ─────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream ─────────────────────────────────────────────────────────────────
    upstream aura_app {
        server app:3000;
        keepalive 32;
    }

    # ── HTTP → redirect to HTTPS (enable when TLS certs are mounted) ─────────────
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main server block ────────────────────────────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl;
        server_name _;

        # TLS (uncomment after mounting certs to nginx/certs/)
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Security headers ─────────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── WebSocket (WhatsApp Live / Twilio Voice bridge) ──────────────────────
        location /api/twilio-voice {
            proxy_pass         http://aura_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # ── Webhook endpoints — no buffering (Meta sends large payloads) ─────────
        location /api/webhook {
            proxy_pass             http://aura_app;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout     30s;
            client_max_body_size   5m;
        }

        # ── All other API + app traffic ──────────────────────────────────────────
        location / {
            proxy_pass           http://aura_app;
            proxy_http_version   1.1;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            client_max_body_size  10m;
        }

        # ── Static assets — long cache ───────────────────────────────────────────
        location ~* \.(js|css|woff2?|ttf|svg|png|ico|webp)$ {
            proxy_pass           http://aura_app;
            proxy_cache_valid    200 7d;
            add_header           Cache-Control "public, max-age=604800, immutable";
        }
    }
}
